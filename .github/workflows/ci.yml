name: CI
on:
push:
branches: [ "main" ]
pull_request:
branches: [ "main" ]
permissions:
contents: read
packages: write
env:
REGISTRY: ghcr.io
IMAGE_OWNER: ${{ github.repository_owner }}
API_IMAGE: hello-team-api
WEB_IMAGE: hello-team-web
jobs:
build-test-and-push:
runs-on: ubuntu-latest
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup .NET
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: '8.0.x'

  - name: Restore
    run: dotnet restore HelloTeam.sln

  - name: Build
    run: dotnet build HelloTeam.sln --configuration Release --no-restore

  - name: Test
    run: dotnet test HelloTeam.sln --configuration Release --no-build --verbosity normal

  # Only push images on main branch
  - name: Login to GHCR
    if: github.ref == 'refs/heads/main'
    uses: docker/login-action@v3
    with:
      registry: ${{ env.REGISTRY }}
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  - name: Set up Docker Buildx
    if: github.ref == 'refs/heads/main'
    uses: docker/setup-buildx-action@v3

  - name: Build & Push API (multi-arch)
    if: github.ref == 'refs/heads/main'
    uses: docker/build-push-action@v5
    with:
      context: .
      file: ./src/HelloTeam.Api/Dockerfile
      platforms: linux/amd64,linux/arm64
      push: true
      tags: |
        ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.API_IMAGE }}:latest
        ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.API_IMAGE }}:${{ github.sha }}

  - name: Build & Push Web (multi-arch)
    if: github.ref == 'refs/heads/main'
    uses: docker/build-push-action@v5
    with:
      context: .
      file: ./src/HelloTeam.Web/Dockerfile
      platforms: linux/amd64,linux/arm64
      push: true
      tags: |
        ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.WEB_IMAGE }}:latest
        ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.WEB_IMAGE }}:${{ 