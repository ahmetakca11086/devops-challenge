name: CI
  on:
    push:
branches:
- main
pull_request:
branches:
- main
permissions:
contents: read
packages: write
jobs:
build:
runs-on: ubuntu-latest
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-dotnet@v4
    with:
      dotnet-version: 8.0.x

  - run: dotnet restore HelloTeam.sln
  - run: dotnet build HelloTeam.sln --configuration Release --no-restore
  - run: dotnet test HelloTeam.sln --configuration Release --no-build

  - name: Login to GHCR
    if: github.ref == 'refs/heads/main'
    uses: docker/login-action@v3
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  - name: Setup Buildx
    if: github.ref == 'refs/heads/main'
    uses: docker/setup-buildx-action@v3

  - name: Build & Push API
    if: github.ref == 'refs/heads/main'
    uses: docker/build-push-action@v5
    with:
      context: .
      file: ./src/HelloTeam.Api/Dockerfile
      platforms: linux/amd64,linux/arm64
      push: true
      tags: |
        ghcr.io/${{ github.repository_owner }}/hello-team-api:latest
        ghcr.io/${{ github.repository_owner }}/hello-team-api:${{ github.sha }}

  - name: Build & Push Web
    if: github.ref == 'refs/heads/main'
    uses: docker/build-push-action@v5
    with:
      context: .
      file: ./src/HelloTeam.Web/Dockerfile
      platforms: linux/amd64,linux/arm64
      push: true
      tags: |
        ghcr.io/${{ github.repository_owner }}/hello-team-web:latest
        ghcr.io/${{ github.repository_owner }}/hello-team-web:${{ github.sha }}
