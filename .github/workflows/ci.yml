name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore HelloTeam.slnx

      - name: Build
        run: dotnet build HelloTeam.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test HelloTeam.slnx --configuration Release --no-build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push API
        uses: docker/build-push-action@v5
        with:
          context: ./src/HelloTeam.Api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/hello-team-api:latest
            ghcr.io/${{ github.repository_owner }}/hello-team-api:${{ github.sha }}

      - name: Build and Push WebApp
        uses: docker/build-push-action@v5
        with:
          context: ./src/HelloTeam.Web
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/hello-team-web:latest
            ghcr.io/${{ github.repository_owner }}/hello-team-web:${{ github.sha }}