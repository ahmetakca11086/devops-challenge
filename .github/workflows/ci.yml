name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore HelloTeam.slnx

      - name: Build
        run: dotnet build HelloTeam.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test HelloTeam.slnx --configuration Release --no-build

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      
      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/HelloTeam.Api/Dockerfile
          no-cache: true
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hello-team-api:latest
            ghcr.io/${{ github.repository_owner }}/hello-team-api:${{ github.sha }}

      
      - name: Build & Push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/HelloTeam.Web/Dockerfile
          no-cache: true
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hello-team-web:latest
            ghcr.io/${{ github.repository_owner }}/hello-team-web:${{ github.sha }}